name: CI & Demo deployment

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Unit tests · Build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (angular-eslint)
        run: npm run lint

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Unit tests (Vitest) with coverage
        run: npm run test:ci

      - name: Production build for GitHub Pages
        run: npm run build:pages

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Prepare Pages artifact (SPA fallback)
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: cp dist/doclib-gui/browser/index.html dist/doclib-gui/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: dist/doclib-gui/browser

  deploy:
    name: Deploy demo to GitHub Pages
    needs: quality
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
